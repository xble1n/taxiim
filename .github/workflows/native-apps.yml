name: Native apps

# Builds the Windows, Android and iOS shells in apps/. They load https://www.taxiim.online,
# so they never contain database credentials or API keys. On main, the Windows installer
# and the Android APK are published as the latest GitHub release, which
# https://www.taxiim.online/download links to.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/sharp-galileo-e60rn3]
    paths: ["apps/**", ".github/workflows/native-apps.yml"]

concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-im-windows
          path: |
            apps/desktop/release/TAXI-IM-Setup-*.exe
            apps/desktop/release/TAXI-IM-Portable-*.exe
          if-no-files-found: error

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      TAXI_IM_VERSION_CODE: ${{ github.run_number }}
      TAXI_IM_KEYSTORE_PASSWORD: ${{ secrets.TAXI_IM_KEYSTORE_PASSWORD }}
      # Optional: the alias defaults to "taxiim" and the key password to the keystore password.
      TAXI_IM_KEY_ALIAS: ${{ secrets.TAXI_IM_KEY_ALIAS }}
      TAXI_IM_KEY_PASSWORD: ${{ secrets.TAXI_IM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Use the release keystore when the secret is set
        env:
          KEYSTORE_BASE64: ${{ secrets.TAXI_IM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/taxi-im-release.jks"
            echo "TAXI_IM_KEYSTORE=$RUNNER_TEMP/taxi-im-release.jks" >> "$GITHUB_ENV"
          else
            echo "No TAXI_IM_KEYSTORE_BASE64 secret: release APK/AAB will be unsigned. The debug APK is installable."
          fi
      - name: Build
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-im-android
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for device without signing (proves the project compiles)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TAXI-IM.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          cd "$RUNNER_TEMP" && zip -qry TAXI-IM-unsigned.xcarchive.zip TAXI-IM.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: taxi-im-ios-unsigned
          path: ${{ runner.temp }}/TAXI-IM-unsigned.xcarchive.zip
          if-no-files-found: error

  release:
    name: Publish downloads
    if: github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files under fixed names
        run: |
          mkdir out
          cp "$(find dist/taxi-im-windows -name 'TAXI-IM-Setup-*.exe' | head -1)" out/TAXI-IM-Setup.exe
          cp "$(find dist/taxi-im-windows -name 'TAXI-IM-Portable-*.exe' | head -1)" out/TAXI-IM-Portable.exe
          # The signed release APK when the keystore secret is set, otherwise the debug APK.
          signed="$(find dist/taxi-im-android -name 'app-release.apk' | head -1)"
          if [ -n "$signed" ]; then
            cp "$signed" out/TAXI-IM.apk
          else
            echo "::warning::No TAXI_IM_KEYSTORE_BASE64 secret: publishing the debug APK. Updates will need an uninstall first."
            cp "$(find dist/taxi-im-android -name 'app-debug.apk' | head -1)" out/TAXI-IM.apk
          fi
          ls -l out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TAXI IM app 1.0.${{ github.run_number }}" \
            --notes "Android and Windows apps. Install from https://www.taxiim.online/download" \
            --latest
